services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    container_name: sunat_api_app
    restart: unless-stopped
    working_dir: /var/www/html
    ports:
      - "8001:8001"
    volumes:
      - ./:/var/www/html
      - ./storage:/var/www/html/storage
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-sunat_api}
      - DB_USERNAME=${DB_USERNAME:-sunat_user}
      - DB_PASSWORD=${DB_PASSWORD:-sunat_password}
      - CACHE_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - SESSION_DRIVER=redis
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-null}
      - REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sunat_network
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:16-alpine
    container_name: sunat_api_postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-sunat_api}
      POSTGRES_USER: ${DB_USERNAME:-sunat_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sunat_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sunat_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sunat_user -d sunat_api"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: sunat_api_redis
    restart: unless-stopped
    ports:
      - "6378:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - sunat_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  queue:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    container_name: sunat_api_queue
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./storage:/var/www/html/storage
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-sunat_api}
      - DB_USERNAME=${DB_USERNAME:-sunat_user}
      - DB_PASSWORD=${DB_PASSWORD:-sunat_password}
      - CACHE_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - SESSION_DRIVER=redis
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-null}
      - REDIS_PORT=6379
    depends_on:
      - app
      - postgres
      - redis
    networks:
      - sunat_network
    command: php artisan queue:work --queue=sunat-send,default --tries=3 --timeout=300

networks:
  sunat_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
